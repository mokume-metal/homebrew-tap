name: Update formula

# **こちらから見に行く。** mokume に「出た」と伝えてもらう形 (repository_dispatch) も
# 試したが、それには mokume 側へこのリポジトリを書ける token を常設することになり、
# fine-grained PAT は最長 366 日で切れる。年 1 度の鍵の入れ替えは「出荷を人手の儀式に
# しない」(mokume の ADR-0001 原則 6) に反し、しかも切れたときに定期リリースの片隅で
# 黙って赤くなる。見に行く形なら鍵が 1 本も要らない (mokume-metal/mokume#410)。
#
# **4 時間ごとに見に行く。時刻を 1 点に合わせない。** mokume の定期リリースは日次になった
# (mokume#1289) が、あちらの予定時刻も GitHub の混雑で数時間ずれて着く。日に 1 度の時刻を
# 合わせにいくと、こちらが先に走った日は丸 1 日遅れる — 実際 01:00 UTC の日次で v0.10.0 と
# v0.11.0 を続けて取り逃した。回数を増やせば、どちらの到着がずれても遅れは 4 時間ほどで済む。
# release:now で臨時に出た版も同じ間隔で拾える。それでも急ぐときは手で起こす。
# 分を 0 から外すのは、毎時丁度が最も混む枠だから (mokume#1290 と同じ理由)。
#
# **pull_request でも同じものを走らせる。** テンプレートや組み立てを変えた PR は、
# 出来上がった formula が実際に入って動くところまでを見ないと通せない — 見る内容は
# 更新時と同じなので、検査を別のワークフローに分けず引き金だけ足す。PR では
# commit の段だけを飛ばす。
on:
  schedule:
    - cron: "47 */4 * * *"
  pull_request:
  workflow_dispatch:
    inputs:
      tag:
        description: "追随するタグ (省くと最新のリリース)"
        required: false
        type: string

permissions:
  contents: write # 自分のリポジトリの formula を commit する
  issues: write # 追随が止まったら起票し、戻ったら畳む (#8)

concurrency:
  group: update-formula
  cancel-in-progress: false

jobs:
  update:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5

      - name: formula を追随させる
        id: update
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: bash scripts/update-formula.sh "$TAG"

      # **利用者と同じ経路で入れる。** Homebrew は tap の外にある formula ファイルを
      # 受け付けない (`brew install ./Formula/mokume.rb` は「formulae to be in a tap」
      # で弾かれる) ので、checkout を Taps の下へ貼ってから名前で入れる。結果として
      # 検査するコマンドが README の案内そのものになる
      #
      # **定期実行では、変わった回だけ試す。** 4 時間ごとに回すと大半の回は版が変わらず、
      # 同じ formula の brew install を日に何度も繰り返すだけになる。飛ばしても止まった
      # 追随を緑に見せる経路はない — 試して落ちた版は commit されないので、次の回も
      # HEAD との差分として「変わった」と判定されて試し直される。PR と手で起こした回は
      # 試すこと自体が目的なので、変わっていなくても試す
      - name: 入れて試す
        if: github.event_name != 'schedule' || steps.update.outputs.changed == 'true'
        run: |
          if [ ! -f Formula/mokume.rb ]; then
            echo "formula がまだ無い (追随できるリリースが出ていない)"
            exit 0
          fi
          tap="$(brew --repository)/Library/Taps/mokume-metal/homebrew-tap"
          mkdir -p "$(dirname "$tap")"
          ln -sfn "$PWD" "$tap"
          brew install --formula mokume-metal/tap/mokume
          brew test mokume-metal/tap/mokume

      # **変わったかは追随の段が決める。** ここで `git diff` に判定をやり直させると、
      # formula がまだ 1 度も commit されていない初回に `Formula/mokume.rb` が未追跡の
      # ままで、書いた直後でも「差分なし」と読まれる — formula の初回作成だけが必ず
      # 失敗し、しかも run は緑になる (#2)。決めた側の出力をそのまま使えば、初回も
      # 2 回目以降も同じ 1 つの判定で足りる
      #
      # **git push でなく API で commit する。** このリポジトリはルールセット
      # `signed-commits` で全ブランチに署名を求めており、runner で `git commit` した
      # bot のコミットは unsigned なので弾かれる。GITHUB_TOKEN で createCommitOnBranch に
      # 作らせたコミットは GitHub が署名する — runner に署名鍵を置かずに済む。
      # expectedHeadOid は checkout した HEAD で、その間に main が進んでいれば弾かれる。
      # これは push の non-fast-forward と同じ振る舞いで、次の回がやり直す
      #
      # **commit の後に HEAD を出した版へ進める。** 後段の report-stall.sh は、出している版を
      # HEAD から読む。API で作ったコミットは手元に無いので、取りに行かないと古い版を名乗る
      - name: 変わっていたら commit する
        if: github.event_name != 'pull_request' && steps.update.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.update.outputs.tag }}
          BRANCH: ${{ github.ref_name }}
        run: |
          jq -n \
            --arg repo "$GITHUB_REPOSITORY" \
            --arg branch "$BRANCH" \
            --arg head "$(git rev-parse HEAD)" \
            --arg headline "chore(formula): mokume を $TAG に上げる" \
            --arg contents "$(base64 < Formula/mokume.rb | tr -d '\n')" \
            '{
              query: "mutation($input: CreateCommitOnBranchInput!) { createCommitOnBranch(input: $input) { commit { oid url } } }",
              variables: { input: {
                branch: { repositoryNameWithOwner: $repo, branchName: $branch },
                expectedHeadOid: $head,
                message: { headline: $headline },
                fileChanges: { additions: [ { path: "Formula/mokume.rb", contents: $contents } ] }
              } }
            }' |
            gh api graphql --input - --jq '.data.createCommitOnBranch.commit.url'
          git fetch --depth=1 origin "$BRANCH"
          git reset -q --hard FETCH_HEAD

      # **止まったことを Issue で名乗り、戻ったら畳む** (#8)。上流の英語化に検査が
      # 追随できず 9 日赤のまま出荷が止まったが、既に配ってある formula は壊れないので
      # 誰も困らず、気付く契機が人の巡回しかなかった (#7)。
      #
      # **commit の段より後に置く。** push が弾かれた回も「出荷が止まった」に数えるため。
      #
      # **1 段で両方をやる。** failure() と success() に割ると、排他のはずの条件が
      # 後から食い違っても誰も気付かない。状態から動作への対応はスクリプトが持つ
      # (cancelled は何もしない)。
      #
      # **PR では走らせない。** 手で起こした回 (workflow_dispatch) は走るが、
      # スクリプトが素振りに切り替えて起票しない — tag を指定して試せる口なので、
      # 古い tag の回に起票すると遅れの数え方が嘘になる
      - name: 追随の状態を発信する
        if: always() && github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_STATUS: ${{ job.status }}
        run: bash scripts/report-stall.sh
